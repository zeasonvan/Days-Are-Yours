name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check client.js && node --check index.js && node --check tests/check.mjs
      - name: Regression suite
        run: node tests/check.mjs
      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle) process.exit(1)"
